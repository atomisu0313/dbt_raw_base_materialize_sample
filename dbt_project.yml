name: 'raw_base_mate'

config-version: 2
version: '0.1'

profile: 'raw_base_mate'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=2.0.0", "<3.0.0"]

vars:
  #execution_date: "current_date()"
  reset_date: 7

seeds:
  raw_base_mate:
    seed_customers:
      +docs:
        node_color: '#cd7f32'
      +column_types:
        id: int
        first_name: varchar
        last_name: varchar
        email: varchar
        updated_at: timestamp
    seed_shops:
      +column_types:
        shop_id: int
        shop_name: varchar
        location: varchar
        loaded_at: timestamp
    seed_orders:
      +column_types:
        order_id: int
        customer_id: int
        shop_id: int
        amount: int
        status: varchar
        ordered_at: timestamp
        updated_at: timestamp
        loaded_at: timestamp

models:
  raw_base_mate:
    +materialized: table
    raw:
      +materialized: table
      +schema: raw
    base:
      +materialized: incremental
      +schema: base
      +docs:
        node_color: 'gold'
    marts:
      +materialized: incremental
      +schema: marts
      +docs:
        node_color: '#4CAF50'
