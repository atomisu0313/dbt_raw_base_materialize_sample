version: 2

models:
  - name: fct_daily_sales
    description: 日次売上トランザクションマート（dbt標準 microbatch インクリメンタル戦略による日次バッチ集計）
    config:
      materialized: incremental
      incremental_strategy: microbatch
      event_time: partition_date
      batch_size: day
      begin: "{{ var('begin', var('execution_date', '2026-10-01')) }}"
    columns:
      - name: order_id
        description: 注文ID
        tests:
          - not_null
      - name: customer_id
        description: 顧客ID
        tests:
          - not_null
      - name: shop_id
        description: 店舗ID
        tests:
          - not_null
      - name: amount
        description: 注文金額
        tests:
          - not_null
      - name: status
        description: 注文ステータス
        tests:
          - not_null
      - name: ordered_at
        description: 注文日時
        tests:
          - not_null
      - name: updated_at
        description: 更新日時
        tests:
          - not_null
      - name: customer_first_name
        description: 顧客名（注文時点断面）
      - name: customer_last_name
        description: 顧客姓（注文時点断面）
      - name: customer_email
        description: 顧客メールアドレス（注文時点断面）
      - name: shop_name
        description: 店舗名（注文時点断面）
      - name: shop_location
        description: 店舗所在地（注文時点断面）
      - name: partition_date
        description: 断面基準日（イベント発生日）
        tests:
          - not_null

unit_tests:
  # ===========================================================================
  # fct_daily_sales (日次売上マート: base_order × base_customer × base_shop)
  # ===========================================================================
  - name: test_fct_daily_sales_normal_join
    description: "【正常系結合】複数顧客・店舗への注文および同一顧客の複数注文が、正しくマスタ属性と結合されファンアウトなく集約されること"
    model: fct_daily_sales
    overrides:
      vars:
        begin: "2026-10-01"
        end: "2026-10-02"
        execution_date: "2026-10-01"
      macros:
        is_incremental: false
    given:
      - input: ref('base_order')
        format: csv
        fixture: fct_daily_sales__normal_join_orders
      - input: ref('base_customer')
        format: csv
        fixture: fct_daily_sales__normal_join_customers
      - input: ref('base_shop')
        format: csv
        fixture: fct_daily_sales__normal_join_shops
    expect:
      format: csv
      fixture: fct_daily_sales__normal_join_expected

  - name: test_fct_daily_sales_left_join_missing_master
    description: "【LEFT JOIN・マスタ不在検証】顧客不在・店舗不在・両マスタ不在の注文が存在してもレコードは欠落せず、該当属性のみNULLとして保持されること"
    model: fct_daily_sales
    overrides:
      vars:
        begin: "2026-10-02"
        end: "2026-10-03"
        execution_date: "2026-10-02"
      macros:
        is_incremental: false
    given:
      - input: ref('base_order')
        format: csv
        fixture: fct_daily_sales__left_join_missing_master_orders
      - input: ref('base_customer')
        format: csv
        fixture: fct_daily_sales__left_join_missing_master_customers
      - input: ref('base_shop')
        format: csv
        fixture: fct_daily_sales__left_join_missing_master_shops
    expect:
      format: csv
      fixture: fct_daily_sales__left_join_missing_master_expected



