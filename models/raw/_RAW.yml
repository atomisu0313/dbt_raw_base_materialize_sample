version: 2

models:
  - name: raw_customers
    description: 顧客マスタのRawデータ（差分連携想定）
    columns:
      - name: id
        description: 顧客ID
        tests:
          - not_null
      - name: first_name
        description: 名
        tests:
          - not_null
      - name: last_name
        description: 姓
        tests:
          - not_null
      - name: email
        description: メールアドレス
        tests:
          - not_null
      - name: updated_at
        description: 更新日時
        tests:
          - not_null

  - name: raw_shops
    description: 店舗マスタのRawデータ（全量連携想定）
    columns:
      - name: shop_id
        description: 店舗ID
        tests:
          - not_null
      - name: shop_name
        description: 店舗名
        tests:
          - not_null
      - name: location
        description: 所在地
        tests:
          - not_null
      - name: loaded_at
        description: 取込日時
        tests:
          - not_null

  - name: raw_orders
    description: 注文イベントのRawデータ（差分連携想定）
    columns:
      - name: order_id
        description: 注文ID
        tests:
          - not_null
      - name: customer_id
        description: 顧客ID
        tests:
          - not_null
      - name: shop_id
        description: 店舗ID
        tests:
          - not_null
      - name: amount
        description: 注文金額
        tests:
          - not_null
      - name: status
        description: 注文ステータス
        tests:
          - not_null
      - name: ordered_at
        description: 注文日時
        tests:
          - not_null
      - name: updated_at
        description: 更新日時
        tests:
          - not_null
      - name: loaded_at
        description: 取込日時
        tests:
          - not_null
