version: 2

models:
  - name: base_customer
    description: 顧客マスタのBaseテーブル（変更履歴ログから展開した日次断面データ）
    config:
      cluster_by: ["partition_date", "id"] # duckdbでは無視？
      meta:
        source_delivery_type: "master_diff"
        expiration_day: 14
        pk_col: ["id"]
        updated_at: "updated_at"
    columns:
      - name: id
        description: 顧客ID
        tests:
          - not_null
      - name: first_name
        description: 名
        tests:
          - not_null
      - name: last_name
        description: 姓
        tests:
          - not_null
      - name: email
        description: メールアドレス
        tests:
          - not_null
      - name: updated_at
        description: 更新日時
        tests:
          - not_null
      - name: partition_date
        description: 断面日付
        tests:
          - not_null

  - name: base_shop
    description: 店舗マスタのBaseテーブル（全量連携データから歯抜け・未来日を補完した日次断面データ）
    config:
      cluster_by: ["partition_date", "shop_id"] # duckdbでは無視？
      meta:
        source_delivery_type: "master_all"
        expiration_day: 14
        pk_col: ["shop_id"]
        loaded_at: "loaded_at"
    columns:
      - name: shop_id
        description: 店舗ID
        tests:
          - not_null
      - name: shop_name
        description: 店舗名
        tests:
          - not_null
      - name: location
        description: 所在地
        tests:
          - not_null
      - name: loaded_at
        description: 実配信の取込日時
        tests:
          - not_null
      - name: partition_date
        description: 断面日付
        tests:
          - not_null

  - name: base_order
    description: 注文イベントのBaseテーブル（差分イベントから最新ステータスを抽出したPKごとの最新1行データ）
    config:
      cluster_by: ["partition_date", "order_id"] # duckdbでは無視？、ordered_at::dateみたいなクラスタリングにするかは要検討
      meta:
        source_delivery_type: "transaction_diff"
        expiration_day: 7
        pk_col: ["order_id","status"]
        updated_at: "updated_at"
        created_at: "ordered_at"
        loaded_at: "loaded_at"
    columns:
      - name: order_id
        description: 注文ID
        tests:
          - not_null
      - name: customer_id
        description: 顧客ID
        tests:
          - not_null
      - name: shop_id
        description: 店舗ID
        tests:
          - not_null
      - name: amount
        description: 注文金額
        tests:
          - not_null
      - name: status
        description: 最新ステータス
        tests:
          - not_null
      - name: ordered_at
        description: 注文日時
        tests:
          - not_null
      - name: updated_at
        description: 最新更新日時
        tests:
          - not_null
      - name: loaded_at
        description: 取込日時
        tests:
          - not_null
      - name: partition_date
        description: 基準日（最新有効日）
        tests:
          - not_null
